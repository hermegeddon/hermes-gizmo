name: gizmo
version: 0.7.0
description: Reduce Hermes tool-schema overhead and show selector savings in the dashboard.
provides_tools:
  - gizmo_select
  - gizmo_status
  - gizmo_request_full_tools
  - gizmo_hydrate_tools
  - gizmo_loaded_tools
